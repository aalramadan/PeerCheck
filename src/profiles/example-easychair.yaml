# An example venue on EasyChair with the IEEE conference format, a template for other venues.
name: Example Conference 2026
source: https://example.org/call-for-papers
submission_system: easychair
# EasyChair names the downloaded PDFs such as CONF_2026_paper_108.pdf.
file_pattern: '_paper_(\d+)\.pdf$'
id_column: '#'

format:
  style: IEEE
  # IEEEtran conference format on US Letter, given as banal reports it (height, width) in points.
  paper_size: [792, 612]
  paper_size_tolerance: 5
  columns: 2
  # 10 pages of main text, figures and appendices included, plus up to 2 pages of references only.
  main_pages: 10
  reference_pages: 2
  # IEEEtran conference margins as banal measures them (top, right, bottom, left), with a tolerance of
  # 18 pt for rounding and compiler noise.
  margins: [52, 48, 72, 48]
  margin_tolerance: 18
  # IEEEtran sets the body in 10 pt, which banal reports as 10.3 pt.
  body_font_max: 10.5
  # banal reports lines 12 pt apart for IEEEtran, 9.3 pt type for the 9pt option, lines 9.8 pt apart for
  # \linespread{0.82}, and lines 11.6 pt apart for a Word paper in Times New Roman with single spacing.
  body_font_min: 9.8
  leading_min: 11.0
  reference_font_min: 8.0
  page_numbers: warning
  required_headings: [introduction, conclusion]
  require_abstract: true

checks:
  # Settings of other checks, off or at their defaults until set.
  # accessibility: true          # notes on tags, language, title, and figure descriptions; {required: true} gives errors
  # images:
  #   max_file_mb: 20            # the upload limit of the venue
  # line_numbers:
  #   missing: warning           # ignore, info, warning, or error for a paper without line numbers
  density:
    # banal counts 6,422 characters per text page on the full pages of an IEEEtran conference paper of continuous
    # text (tests/fixtures/density/template-ieee.pdf).
    template_characters: 6422
  sigsoft:
    enabled: true
  anonymity:
    # Common hosts for anonymous artifacts and archives.
    allowed_hosts: [anonymous.4open.science, zenodo.org, figshare.com, osf.io, doi.org]
    flag_acknowledgments: true
  hidden_text:
    enabled: true
  references:
    enabled: true
    # Offline by default. online sends DOIs and arXiv IDs only; online_titles also sends titles.
    online: false
    online_titles: false
