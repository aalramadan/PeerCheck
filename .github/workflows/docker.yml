name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: peercheck:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the examples with the image
        run: |
          docker run --rm peercheck:test --version
          docker run --rm -v "$PWD/examples:/data/examples" peercheck:test --template examples/template.yaml \
            --papers examples/papers --authors examples/authors.csv --out /tmp/report.xlsx
          docker run -d --name page -p 127.0.0.1:8765:8765 peercheck:test --gui
          for attempt in $(seq 30); do curl -sf http://127.0.0.1:8765/ -o page.html && break; sleep 1; done
          grep -q "<title>PeerCheck</title>" page.html
          docker rm -f page
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/peercheck
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Without the provenance record, which GitHub lists as a second platform, unknown/unknown.
          provenance: false
      - name: Delete the images that lost their tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/prune_images.py
