[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "PeerCheck"
version = "1.0.0"
description = "Local checks of conference submissions and peer reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6",
    "defusedxml>=0.7",
    "lxml>=5",
    "rapidfuzz>=3",
    "datasketch>=1.6",
    # The hidden-text check calls internal functions of this release.
    "pdfguardrail==0.3.0",
    # The clipped-text rule was tested on 1.28.2. PyMuPDF 2 pulls onnxruntime and layout models.
    "pymupdf>=1.28.2,<2",
    # The integrity check reads the structure of a PDF with qpdf.
    "pikepdf>=8",
]

[project.optional-dependencies]
# The detectors CoCoDet and EditLens.
reviews = ["torch>=2.6", "transformers>=4.56", "huggingface_hub>=0.23"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
peercheck = "peercheck.cli:main"

[tool.setuptools]
# The package peercheck is the folder src/ itself. The venue profiles stay in profiles/ and the tools and data of other
# authors in external/. A wheel holds the profiles in peercheck/profiles/ and the files of external/ that the checks
# need, with their licenses, in peercheck/external/.
package-dir = {"peercheck" = "src", "peercheck.profiles" = "profiles", "peercheck.external" = "external"}
packages = ["peercheck", "peercheck.papers", "peercheck.reviews", "peercheck.profiles", "peercheck.external"]

[tool.setuptools.package-data]
peercheck = ["gui.html"]
"peercheck.profiles" = ["*.yaml"]
"peercheck.external" = ["hotcrp/banal", "hotcrp/LICENSE", "hotcrp/affiliationmatchers.json",
                        "submission-checker/submission-checker.jar", "submission-checker/LICENSE",
                        "census-surnames/census_surnames.txt", "publicsuffix/public_suffix_list.dat",
                        "publicsuffix/LICENSE", "snowball/stop.txt", "snowball/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# The tools of other authors stay as their authors wrote them.
extend-exclude = ["external"]

[tool.ruff.lint.isort]
# The package peercheck sits in src/, which isort cannot match by name.
known-first-party = ["peercheck"]
